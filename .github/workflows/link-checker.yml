name: 🔗 Link Checker

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'apis/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'apis/**'
  workflow_dispatch:

jobs:
  check-links:
    name: Check all links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run link checker
        run: npm run check-links
        continue-on-error: true

      - name: Upload broken links report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broken-links-report
          path: broken-links.json
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '✅ All links are valid!';
            try {
              const broken = JSON.parse(fs.readFileSync('broken-links.json', 'utf8'));
              if (broken.length > 0) {
                report = `⚠️ **${broken.length} broken link(s) found:**\n\n`;
                broken.forEach(link => {
                  report += `- \`${link.url}\` → ${link.status}\n`;
                });
              }
            } catch (e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
