name: Weekly Maintenance

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  weekly-check:
    name: Weekly Link Check & Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run link checker
        id: linkcheck
        continue-on-error: true
        run: npm run check-links

      - name: Generate repository stats
        run: npm run stats

      - name: Open issue if links are broken
        if: steps.linkcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "The weekly link checker found one or more broken links. See the workflow run for the full `broken-links.json` report.\n\n";
            try {
              const report = JSON.parse(fs.readFileSync('broken-links.json', 'utf8'));
              const broken = (Array.isArray(report) ? report : report.links || [])
                .filter(l => l.state && l.state !== 'OK')
                .slice(0, 25);
              if (broken.length) {
                body += broken.map(l => `- \`${l.url}\` — ${l.state}`).join('\n');
              }
            } catch (e) {
              body += "_Could not parse broken-links.json — check the workflow logs._";
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated] Broken links found — ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ["broken-link", "automated"],
            });
